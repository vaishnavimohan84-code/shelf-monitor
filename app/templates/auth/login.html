{% extends "base.html" %}
{% block title %}Login - Shelf Monitor{% endblock %}
{% block guest_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; background:#f4f6f9;">
    <div class="card shadow-sm" style="width: 380px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="fa-solid fa-boxes-stacked fa-2x text-primary"></i>
                <h4 class="mt-2 mb-0">AI Shelf Monitor</h4>
                <small class="text-muted">Sign in to continue</small>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
